app:
  name: "Nool"
  logging_level: "INFO"

paths:
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  model_cache_dir: ".cache/models"
  artifact_dir: "data/manifests"

models:
  cache_dir: ".cache/models"

retrieval:
  hybrid:
    candidate_k: 10
    rank_constant: 20
    top_k: 10
  bm25:
    corpus_path: "data/processed/hotpotqa_sample/corpus.jsonl"
    index_dir: "indexes/hotpotqa_sample_bm25"
    method: "lucene"
    k1: 1.5
    b: 0.75
    stopwords: "english"
    stemming: false
    indexed_fields:
      - "title"
      - "text"
    top_k: 10
  contriever:
    model_id: "facebook/contriever"
    model_revision: "2bd46a25019aeea091fd42d1f0fd4801675cf699"
    embedding_dim: 768
    pooling: "masked_mean"
    max_seq_length: 512
    passage_fields:
      - "title"
      - "text"
    normalize_embeddings: false
    similarity: "dot_product"
    artifact_dir: "indexes/contriever_hotpotqa_sample"
    corpus_path: "data/processed/hotpotqa_sample/corpus.jsonl"
    top_k: 10
    device: "cpu"
